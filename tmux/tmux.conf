# =================================================================aces
# General Settings
# =================================================================

# Enable True Color (24-bit) support
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Enable mouse support
set -g mouse on

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Fix escape time delay for Vim/Neovim
set -sg escape-time 0

# =================================================================
# Keybindings & Navigation (vim-tmux-navigator)
# =================================================================

# Seamless pane navigation with Ctrl + hjkl (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\.'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Reload tmux config easily with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf!"

# =================================================================
# Vi Mode & Copy Mode Bindings
# =================================================================

# Enable vi keys in copy mode (activated with prefix + [)
setw -g mode-keys vi

# Better visual selection and copying in vi-mode (compatible with tmux-yank)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# =================================================================
# Quick Configuration Reload
# =================================================================

# Reload tmux.conf instantly with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded successfully!"

# =================================================================
# Plugins (TPM)
# =================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- Theme Switcher Section ---
# Uncomment ONLY ONE of the themes below to use it, or switch between them.
# Make sure the corresponding plugin folder is inside your plugins directory (~/.tmux/plugins/).

# 1. Everforest Theme
# source-file ~/.config/tmux/plugins/tmux-everforest/tmux-everforest.tmux # Update path/repo if needed

# 2. Luna Theme
# source-file ~/.config/tmux/plugins/tmux-luna/tmux-luna.tmux

# 3. Oldworld Theme
source-file ~/.config/tmux/plugins/tmux-oldworld/tmux-oldworld.tmux

# 4. Evergreen Theme
# source-file ~/.config/tmux/plugins/tmux-luna/tmux-oldworld.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
